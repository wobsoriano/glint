[package]
name = "prettyshot"
version = "0.1.0"
edition = "2021"
description = "Beautiful screenshots for Windows, built with GPUI"

[dependencies]
gpui = "0.2.2"
xcap = "0.9.8"
global-hotkey = "0.8"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
arboard = { version = "3", features = ["image-data"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
anyhow = "1"
smallvec = "1"
raw-window-handle = "0.6"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_WinRT",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
