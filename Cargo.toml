[package]
name = "glint"
version = "0.1.0"
edition = "2021"
description = "Screenshots, annotation and screen recording for Windows, built with GPUI"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
windows = "0.62"

[dependencies]
glint-render = { path = "crates/glint-render" }
glint-media = { path = "crates/glint-media" }
glint-transcribe = { path = "crates/glint-transcribe" }
glint-studio = { path = "crates/glint-studio" }
gpui = "0.2.2"
xcap = "0.9.8"
global-hotkey = "0.8"
tray-icon = "0.26"
image = { workspace = true }
tiny-skia = "0.11"
ab_glyph = "0.2"
arboard = { version = "3", features = ["image-data"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
smallvec = "1"
raw-window-handle = "0.6"
# `#[implement]` expands to `::windows_core` paths.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_WinRT",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Controls",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
]

[profile.dev.package."*"]
opt-level = 2

# The compositor runs per pixel on every preview frame.
[profile.dev.package.glint-render]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
