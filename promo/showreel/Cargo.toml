[package]
name = "glint-showreel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.2.1-rc.44", features = ["compile-time-svgtree", "cli"] }

[lib]
name = "glint_showreel"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "glint-showreel"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
