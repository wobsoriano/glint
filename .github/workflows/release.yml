name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(jq -r .version mygo.json)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error file=mygo.json::version '$version' is not semver, so the tag would not be v<semver>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Not yet published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.read.outputs.version }}
        run: |
          # A published release keeps the files it shipped with. Drafts may be rebuilt.
          published=$(gh release list --limit 200 --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG\" and (.isDraft | not)) | .tagName")
          if [ -n "$published" ]; then
            echo "::error file=mygo.json::$TAG is already published. Bump version in mygo.json for a new release."
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Signing starts once the SignPath project is set up; see "Code signing" in docs/building.md.
      SIGN: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go.sum pins the mygo CLI, which pins the NSIS it downloads for the installer.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - run: go tool mygo build -platform windows/amd64
      # The GUI subsystem, the icon and the version information.
      - run: go run ./tools/packagecheck build/windows-amd64/Glint.exe

      - name: Upload Glint.exe for signing
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          path: build/windows-amd64/Glint.exe
          archive: false
          if-no-files-found: error
      - name: Sign Glint.exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Each request waits for a person to approve it in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          skip-decompress: true
      # The installer holds Glint.exe compressed, where SignPath cannot sign it. So build again
      # with tools/signswap as the sign command: the build is reproducible, and signswap puts the
      # signed Glint.exe in place before mygo packs the installer.
      - name: Build the installer around the signed Glint.exe
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          GLINT_UNSIGNED_DIR: ${{ github.workspace }}/unsigned
          GLINT_SIGNED_DIR: ${{ github.workspace }}/signed
        run: |
          New-Item -ItemType Directory unsigned | Out-Null
          Copy-Item build/windows-amd64/Glint.exe unsigned/Glint.exe
          $config = Get-Content mygo.json -Raw | ConvertFrom-Json
          if (-not $config.windows) { $config | Add-Member windows ([pscustomobject]@{}) }
          $config.windows | Add-Member signCommand 'go run ./tools/signswap %1' -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content mygo.json
          go tool mygo build -platform windows/amd64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sig = Get-AuthenticodeSignature build/windows-amd64/Glint.exe
          if ($sig.Status -ne 'Valid') { throw "Glint.exe is not signed: $($sig.Status) $($sig.StatusMessage)" }

      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "build/windows-amd64/Glint Setup $env:VERSION amd64.exe" "dist/Glint-$env:VERSION-windows-x64-setup.exe"
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          path: dist/Glint-${{ env.VERSION }}-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist
          skip-decompress: true
      - name: Check the installer's signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/Glint-$env:VERSION-windows-x64-setup.exe"
          if ($sig.Status -ne 'Valid') { throw "the installer is not signed: $($sig.Status) $($sig.StatusMessage)" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Glint-${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: [version, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      VERSION: ${{ needs.version.outputs.version }}
      DRAFT: ${{ inputs.draft }}
    steps:
      # Only the final installer: the files uploaded for SignPath are artifacts of this run too.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - run: |
          # Drafts have no git tag yet, so look them up in the release list rather than by tag.
          # The version job already refused published releases, so a match here is a draft.
          if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [ "$DRAFT" = true ]; then flags+=(--draft); fi
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Glint $VERSION" --generate-notes "${flags[@]}"
          fi
