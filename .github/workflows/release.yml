name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(jq -r .version mygo.json)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error file=mygo.json::version '$version' is not semver, so the tag would not be v<semver>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Not yet published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.read.outputs.version }}
        run: |
          # A published release keeps the files it shipped with. Drafts may be rebuilt.
          published=$(gh release list --limit 200 --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG\" and (.isDraft | not)) | .tagName")
          if [ -n "$published" ]; then
            echo "::error file=mygo.json::$TAG is already published. Bump version in mygo.json for a new release."
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # mygo build signs the app ad hoc and puts it in a disk image, which needs macOS.
      - run: go tool mygo build -platform darwin/universal
      - run: cp "build/darwin-universal/Glint ${{ needs.version.outputs.version }}.dmg" "Glint-${{ needs.version.outputs.version }}-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Glint-${{ needs.version.outputs.version }}-macos-universal.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go.sum pins the mygo CLI, which pins the NSIS it downloads for the installer.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - run: go tool mygo build -platform windows/amd64
      # The GUI subsystem, the icon and the version information.
      - run: go run ./tools/packagecheck build/windows-amd64/Glint.exe
      - shell: pwsh
        run: Copy-Item "build\windows-amd64\Glint Setup ${{ needs.version.outputs.version }} amd64.exe" "Glint-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Glint-${{ needs.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      VERSION: ${{ needs.version.outputs.version }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: |
          # Drafts have no git tag yet, so look them up in the release list rather than by tag.
          # The version job already refused published releases, so a match here is a draft.
          if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [ "$DRAFT" = true ]; then flags+=(--draft); fi
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Glint $VERSION" --generate-notes "${flags[@]}"
          fi
